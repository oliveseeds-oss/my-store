# Nginx Security Headers & Optimizations Snippet for oliveseedsdesignstudio.com
# Apply these inside your HTTPS `server { ... }` block on Hostinger (e.g. /etc/nginx/sites-available/oliveseedsdesignstudio.com)

# Hide Nginx version
server_tokens off;

# 1. Security Headers
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy (Report-Only initially, enforcing once Razorpay/Shiprocket verified)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'" always;

# 2. TLS/SSL Enhancements (OCSP Stapling)
ssl_stapling on;
ssl_stapling_verify on;

# 3. Performance / Caching for Static Assets
# This location block applies aggressive caching to versioned static assets.
location ~* \.(js|css|png|jpg|jpeg|webp|avif|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
